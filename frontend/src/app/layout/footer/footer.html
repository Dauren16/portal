<footer class="footer">
  <div class="container">
    <div class="footer__wrapper">
      <div class="footer__title-block">
        <img class="footer__logo" width="121" src="./logo/footer-logo.png" alt="#">
        <span class="footer__text">{{ 'footer.title' | t }}</span>
      </div>
      <div class="footer__address-block">
        <img class="footer__address-block-pin" width="14" height="18" src="./logo/pin.png" alt="#">
        <span class="footer__text">{{ 'footer.address' | t }}
        </span>
      </div>
      <div class="footer__social-block">
        <span class="footer__text">{{ 'footer.social' | t }}</span>
        <ul class="footer__social-list">
          <li class="footer__social-item">
            <a href="#"><img src="./logo/facebook.png" alt="#"></a>
          </li>
          <li class="footer__social-item">
            <a href="#"><img src="./logo/instagram.png" alt="#"></a>
          </li>
          <li class="footer__social-item">
            <a href="#"><img src="./logo/youtube.png" alt="#"></a>
          </li>
          <li class="footer__social-item">
            <a href="#">
              <img src="./logo/telegram.png" alt="#">
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>
<div class="footer-caption">
  <div class="container">
    <div class="footer-caption__wrapper">
      <span class="footer-caption__text">{{ 'footer.caption' | t }}</span>
    </div>
  </div>
</div>
