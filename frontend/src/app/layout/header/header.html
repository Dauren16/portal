<header class="header">
  <div class="container">
    <div class="header__wrapper">
      <a class="header__link" href="#">
        <img class="header__logo" src="./logo/nitec.svg" alt="#">
        <h1 class="header__title">{{ title() }}</h1>
      </a>
      <nav class="header__nav">
        <ul class="header__nav-list">
          <li class="header__nav-item"><a routerLink="" routerLinkActive="header__nav-link--active" [routerLinkActiveOptions]="{ exact: true }" class="header__nav-link">{{ homePage }}</a></li>
          <li class="header__nav-item"><a routerLink="softwares" routerLinkActive="header__nav-link--active" class="header__nav-link">{{ softwaresPage }}</a></li>
          <li class="header__nav-item"><a routerLink="contacts" routerLinkActive="header__nav-link--active" class="header__nav-link">{{ contactsPage }}</a></li>
        </ul>
      </nav>
      <div class="language">
        <button class="language__btn">
        <img class="language__img" src="./logo/language.svg" alt="#">
        <span class="language__text">RU</span>
        <img src="./logo/down.png" alt="#">
      </button>
      </div>
      <div class="login">
        <button class="login__btn">
          <span class="login__text">Войти</span>
        </button>
      </div>
    </div>
  </div>
</header>
