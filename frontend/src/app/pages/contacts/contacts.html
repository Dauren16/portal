@if(contacts(); as contacts) {
  <section class="contacts">
    <div class="container">
      <ul class="contacts__list">
        @for (contact of contacts; track contact.id) {
          <li class="contacts__item">
            <app-contact-card [contact]="contact"/>
          </li>
        }
      </ul>
    </div>
  </section>
} @else {
  <app-loader/>
}
