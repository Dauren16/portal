@if(systems(); as systems) {
  <section class="systems">
    <div class="container">
      <ul class="systems__list">
        @for (system of systems; track system.id) {
          <li class="systems__item">
            <app-system-card [system]="system"/>
          </li> 
        }
      </ul>  
    </div>
  </section>
} @else {
  <app-loader/>
}
