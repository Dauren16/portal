<div class="contact">
  <h2 class="contact__title">{{ title() }}</h2>
  <div class="contact__phone-wrapper">
    <h3 class="contact__heading">Телефон</h3>
    <div class="contact__phones">
      @for (phone of contact().phones; track phone) {
        <span class="contact__phone">{{ phone }}</span>
      }
    </div>
  </div>
  <div class="contact__emails-wrapper">
    <h3 class="contact__heading">Почта</h3>
    <div class="contact__emails">
      @for (email of contact().emails; track email) {
        <span class="contact__email">{{ email }}</span>
      }
    </div>
  </div>
</div>
